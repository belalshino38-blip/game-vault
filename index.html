<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Vault</title>

    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .nav-links button {
            background: none;
            border: none;
            color: var(--text-light);
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .nav-links button:hover, .nav-links button.active {
            color: var(--accent);
        }

        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1rem));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 { margin: 0; color: var(--accent); font-size: 1.5rem; }
        .stat-card p { margin: 0.5rem 0 0 0; color: var(--text-muted); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        .toast {
            position: fixed;
            bottom: 20px; right: 20px;
            background: var(--accent);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            display: none;
        }

        .toast.show { display: block; }
        .toast.error { background: var(--danger); }

        .upload-area {
            border: 2px dashed #475569;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .upload-area.dragover { border-color: var(--accent); }
    </style>
</head>
<body>

    <nav>
        <h2>🎮 Game Vault</h2>
        <div class="nav-links">
            <button onclick="showGames()">Games</button>
            <button onclick="showPosts()">Posts</button>
            <button onclick="showFriends()">Friends</button>
            <button onclick="showProfile()">Profile</button>
        </div>
    </nav>

    <div class="container">
        <!-- Stats Dashboard -->
        <div class="stats-grid">
            <div class="stat-card"><h3 id="totalGames">0</h3><p>Total Games</p></div>
            <div class="stat-card"><h3 id="completedCount">0</h3><p>Completed</p></div>
            <div class="stat-card"><h3 id="playingCount">0</h3><p>Playing</p></div>
            <div class="stat-card"><h3 id="lookingCount">0</h3><p>Looking For</p></div>
            <div class="stat-card"><h3 id="lfgCount">0</h3><p>LFG Active</p></div>
        </div>

        <!-- Search Bar -->
        <input type="text" id="searchInput" placeholder="Search games..." style="width: 100%; padding: 0.75rem; margin-bottom: 1.5rem; border-radius: 6px; border: 1px solid #334155; background: var(--card-bg); color: white;">

        <!-- Views -->
        <div id="gamesView" class="view-section active">
            <h3>Game Catalog</h3>
            <div id="gamesContainer"></div>
            
            <!-- Controls Example -->
            <div style="margin-top: 1rem; background: var(--card-bg); padding: 1rem; border-radius: 8px;">
                <label><input type="checkbox" id="playingCheckbox"> Currently Playing</label><br>
                <label><input type="checkbox" id="lookingCheckbox"> Want to Play</label><br>
                <label><input type="checkbox" id="lfgCheckbox" onchange="toggleLFG(this)"> Looking for Group (LFG)</label>
            </div>
        </div>

        <div id="postsView" class="view-section">
            <h3>Community Posts</h3>
            <button onclick="openPostModal()">+ Create Post</button>
            <div id="postsContainer"></div>
        </div>

        <div id="friendsView" class="view-section">
            <div style="margin-bottom: 1rem;">
                <button id="tabAll" class="active" onclick="switchFriendsTab('all')">All Friends</button>
                <button id="tabRequests" onclick="switchFriendsTab('requests')">Requests</button>
            </div>
            <div id="friendsListContainer"></div>
            <div id="requestsContainer" style="display: none;"></div>
        </div>

        <div id="profileView" class="view-section">
            <h3>User Profile</h3>
            <p>Completed: <span id="profileCompleted">0</span></p>
            <p>Playing: <span id="profilePlaying">0</span></p>
            <p>Looking: <span id="profileLooking">0</span></p>
            <p>LFG: <span id="profileLFG">0</span></p>
        </div>
    </div>

    <!-- Modals -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <h3>Create Post</h3>
            <div onclick="showGameDropdown()">Select Game</div>
            <div id="gameDropdown" style="display:none;">List of games...</div>
            <button onclick="submitPost()">Submit</button>
            <button onclick="closePostModal()">Close</button>
        </div>
    </div>

    <div id="searchModal" class="modal">
        <div class="modal-content">
            <h3>Search Users</h3>
            <button onclick="closeSearchModal()">Close</button>
        </div>
    </div>

    <div id="friendProfileModal" class="modal">
        <div class="modal-content">
            <h3>Friend Profile</h3>
            <button onclick="closeFriendProfile()">Close</button>
        </div>
    </div>

    <!-- File Upload Target -->
    <div id="uploadArea" class="upload-area" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropSave(event)">
        Drag & Drop Save File Here
    </div>

    <!-- Toast Notification System -->
    <div id="toast" class="toast"></div>

    <script>
        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- Application State ---
        let currentGame = { id: "game1", title: "Sample Game" };
        let games = [currentGame];
        let currentUser = { uid: "user123" };
        let myLFG = [];
        let myPlaying = [];
        let myLooking = [];
        let myCompletions = [];

        function init() {
            updateStats();
            renderGames();
        }

        function renderGames(filter = "") {
            const container = document.getElementById("gamesContainer");
            if (container) {
                container.innerHTML = `<p>Loaded ${games.length} game(s).</p>`;
            }
        }

        function updateStatusLabels() {
            console.log("Status labels updated.");
        }

        // --- Core LFG Toggle Function ---
        async function toggleLFG(cb) {
            if (!currentUser || !currentGame) return;
            const ref = db.collection("users").doc(currentUser.uid).collection("gameStatus").doc(currentGame.id);
            
            try {
                if (cb.checked) {
                    await ref.set({ status: "lfg", updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                    if (!myLFG.includes(currentGame.id)) myLFG.push(currentGame.id);
                    if (myPlaying.includes(currentGame.id)) { 
                        await db.collection("users").doc(currentUser.uid).collection("gameStatus").doc(currentGame.id).set({ status: "lfg", updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); 
                        myPlaying = myPlaying.filter(id => id !== currentGame.id); 
                        document.getElementById("playingCheckbox").checked = false; 
                    }
                    if (myLooking.includes(currentGame.id)) { 
                        await db.collection("users").doc(currentUser.uid).collection("gameStatus").doc(currentGame.id).set({ status: "lfg", updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); 
                        myLooking = myLooking.filter(id => id !== currentGame.id); 
                        document.getElementById("lookingCheckbox").checked = false; 
                    }
                } else { 
                    await ref.delete(); 
                    myLFG = myLFG.filter(id => id !== currentGame.id); 
                }
                updateStatusLabels(); 
                renderGames(document.getElementById("searchInput").value); 
                updateStats(); 
                showToast(cb.checked ? "Looking for Group!" : "Removed from LFG");
            } catch (err) { 
                showToast("Error: " + err.message, true); 
                cb.checked = !cb.checked; 
            }
        }

        // --- Navigation ---
        function hideAllViews() {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        }

        function showGames() { hideAllViews(); document.getElementById("gamesView").classList.add("active"); }
        function showFriends() { hideAllViews(); document.getElementById("friendsView").classList.add("active"); }
        function showPosts() { hideAllViews(); document.getElementById("postsView").classList.add("active"); }
        function showProfile() { hideAllViews(); document.getElementById("profileView").classList.add("active"); }

        // --- Toast & UI Helpers ---
        function showToast(msg, isError = false) {
            const toastEl = document.getElementById("toast");
            toastEl.textContent = msg;
            toastEl.className = isError ? "toast error show" : "toast show";
            setTimeout(() => { toastEl.classList.remove("show"); }, 3000);
        }

        function updateStats() {
            document.getElementById("totalGames").textContent = games.length + "+";
            document.getElementById("completedCount").textContent = myCompletions.length;
            document.getElementById("playingCount").textContent = myPlaying.length;
            document.getElementById("lookingCount").textContent = myLooking.length;
            document.getElementById("lfgCount").textContent = myLFG.length;
            
            if (document.getElementById("profileCompleted")) {
                document.getElementById("profileCompleted").textContent = myCompletions.length;
                document.getElementById("profilePlaying").textContent = myPlaying.length;
                document.getElementById("profileLooking").textContent = myLooking.length;
                document.getElementById("profileLFG").textContent = myLFG.length;
            }
        }

        // --- Modal Control ---
        function openPostModal() { document.getElementById("postModal").classList.add("active"); }
        function closePostModal() { document.getElementById("postModal").classList.remove("active"); }
        function openSearchModal() { document.getElementById("searchModal").classList.add("active"); }
        function closeSearchModal() { document.getElementById("searchModal").classList.remove("active"); }
        function closeFriendProfile() { document.getElementById("friendProfileModal").classList.remove("active"); }

        // --- Drag & Drop Stubs ---
        function allowDrop(e) { e.preventDefault(); document.getElementById("uploadArea").classList.add("dragover"); }
        function leaveDrop(e) { e.preventDefault(); document.getElementById("uploadArea").classList.remove("dragover"); }
        function dropSave(e) { 
            e.preventDefault(); 
            document.getElementById("uploadArea").classList.remove("dragover"); 
            showToast("File drop detected.");
        }

        // --- Friend & Post Stubs ---
        function switchFriendsTab(tab) {
            document.getElementById("tabAll").classList.toggle("active", tab === "all");
            document.getElementById("tabRequests").classList.toggle("active", tab === "requests");
            document.getElementById("friendsListContainer").style.display = tab === "all" ? "block" : "none";
            document.getElementById("requestsContainer").style.display = tab === "requests" ? "block" : "none";
        }

        function submitPost() { showToast("Post created successfully!"); closePostModal(); }
        function showGameDropdown() { document.getElementById("gameDropdown").style.display = "block"; }

        // --- Initialize App on Load ---
        window.onload = init;
    </script>
</body>
</html>
